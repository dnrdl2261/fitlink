name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # 실패 시 jest 출력을 **어노테이션**으로 내보낸다.
      # 로그 본문과 잡 요약은 로그인해야 읽을 수 있지만 어노테이션은 공개 API로 읽힌다.
      # 로컬·깨끗한 설치에서는 통과하는데 CI에서만 깨지는 환경 차이를 진단하기 위한 장치다.
      - name: Test
        run: |
          set +e
          npx jest --ci 2>&1 | tee jest.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(tail -c 1800 jest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/ /g;s/\n/%0A/g')
            echo "::error title=jest 실패 (node $(node -v))::${msg}"
          fi
          exit $code
